<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verify you're human</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <div id="captcha" class="captcha">
      <div class="captcha-header">
        <div class="captcha-header-text">
          <div class="captcha-header-instruction">Select all images with</div>
          <div class="captcha-header-target">Fariha</div>
          <div class="captcha-header-hint">Click verify once there are none left.</div>
        </div>
        <div class="captcha-header-logo">
          <div class="captcha-logo-icon" aria-hidden="true">
            <svg viewBox="0 0 32 32" width="32" height="32">
              <circle cx="16" cy="16" r="14" fill="none" stroke="#fff" stroke-width="2" />
              <path d="M10 17 l4 4 l8 -10" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </div>
          <div class="captcha-logo-text">
            <span>reCAPTCHA</span>
            <small>Privacy &mdash; Terms</small>
          </div>
        </div>
      </div>

      <div id="grid" class="grid" role="group" aria-label="Captcha image grid"></div>

      <div id="error" class="error" hidden>Please select all matching images.</div>

      <div class="captcha-footer">
        <div class="captcha-footer-icons" aria-hidden="true">
          <button type="button" class="icon-btn" id="reload-btn" title="Get a new challenge">
            <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M17.65 6.35A7.95 7.95 0 0 0 12 4a8 8 0 1 0 7.74 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4z"/></svg>
          </button>
          <button type="button" class="icon-btn" title="Audio challenge" disabled>
            <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4.03v8.05A4.5 4.5 0 0 0 16.5 12zM14 3.23v2.06a7 7 0 0 1 0 13.42v2.06a9 9 0 0 0 0-17.54z"/></svg>
          </button>
          <button type="button" class="icon-btn" title="Help" disabled>
            <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M11 18h2v-2h-2v2zm1-16C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18a8 8 0 1 1 0-16 8 8 0 0 1 0 16zm0-14a4 4 0 0 0-4 4h2a2 2 0 1 1 4 0c0 2-3 1.75-3 5h2c0-2.25 3-2.5 3-5a4 4 0 0 0-4-4z"/></svg>
          </button>
        </div>
        <button id="verify-btn" type="button" class="verify-btn">VERIFY</button>
      </div>
    </div>

    <div id="success" class="success" hidden>
      <div class="success-card">
        <div class="success-confetti" aria-hidden="true"></div>
        <h1>Happy birthday, Fariha! :)</h1>
      </div>
    </div>
  </main>

  <footer class="signoff">Love, Sam &lt;3</footer>

  <script src="script.js"></script>
</body>
</html>
